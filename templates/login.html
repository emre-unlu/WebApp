{# login.html - sign-in page. typed codename preserved. #}
{% extends "base.html" %}

{% block title %}Sign In — FIBooking{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="fs-3 mb-1">Sign in</h1>
        <p class="text-body-secondary">Enter your codename and cipher.</p>

        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">Codename</label>
            <input class="form-control" id="username" name="username" type="text"
                   required value="{{ request.form.get('username', '') }}">
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Cipher</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>

          {% if error %}
            <p class="text-danger"><i class="bi bi-exclamation-octagon-fill"></i> {{ error }}</p>
          {% endif %}

          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>

      
      </div>
    </div>
  </div>
</div>
{% endblock %}
